<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#52694d">
<meta name="description" content="재료별 요리 추천, 주간 식단, 자동 장보기 목록을 한 곳에서 관리하는 가족 레시피 앱">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>우리집 식탁 · Table Mate</title>
<style>
:root{--bg:#f7f6f1;--paper:#fff;--ink:#242a23;--muted:#6b7268;--green:#52694d;--green2:#e9efe5;--line:#e4e6dd;--accent:#d98452;--shadow:0 8px 28px #26301d0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#f7f6f1ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.head{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:850;font-size:19px;letter-spacing:-.6px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:1.4px;margin-top:2px}.pill{border:0;border-radius:999px;background:var(--green2);color:var(--green);padding:9px 12px;font-weight:700}.wrap{max-width:1050px;margin:auto;padding:18px 14px 105px}.hero{background:linear-gradient(130deg,#e8eee2,#f5eadc);border-radius:24px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"🍲";font-size:76px;position:absolute;right:16px;bottom:0;opacity:.75}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#61705b;font-weight:800}.hero h1{font-size:28px;line-height:1.25;letter-spacing:-1px;margin:9px 0 8px;max-width:70%}.hero p{color:#62695e;font-size:13px;line-height:1.55;max-width:72%;margin:0}.stats{display:flex;gap:8px;margin-top:16px}.stat{background:#ffffffb8;border-radius:12px;padding:9px 12px;font-size:12px}.stat b{display:block;font-size:17px}.section{margin:24px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px}.section h2{font-size:19px;margin:0;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);min-width:0}.group-icon{font-size:25px}.card h3{font-size:15px;margin:8px 0 5px}.card p{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.chip{font-size:11px;background:#f1f2ec;padding:5px 8px;border-radius:999px;color:#50594b}.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 13px;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:var(--green2);color:var(--green)}.danger{background:#f8e8e3;color:#934c39}.full{width:100%}.field{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;color:var(--ink);outline-color:var(--green)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.filterbar{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin:10px 0}.filterbar button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font-size:12px}.filterbar button.active{background:var(--green);border-color:var(--green);color:white}.recipe-card{display:flex;gap:12px;align-items:flex-start}.food-emoji{width:62px;height:62px;border-radius:15px;background:#f0eee5;display:grid;place-items:center;font-size:31px;flex-shrink:0}.recipe-info{flex:1;min-width:0}.recipe-info h3{margin:1px 0 5px}.tiny{font-size:11px;color:var(--muted)}.recipe-actions{display:flex;gap:6px;margin-top:10px}.recipe-actions button{padding:8px 10px;font-size:12px}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffef9ed;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tab-inner{width:100%;max-width:650px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.tab{border:0;background:transparent;color:#7b8176;padding:5px 0;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.tab span{font-size:20px}.tab.active{color:var(--green);font-weight:800}.slot{background:white;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:8px}.slot-title{font-size:12px;font-weight:800;margin-bottom:7px}.slot select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:white;font-size:12px}.day-head{display:flex;justify-content:space-between;align-items:center;margin:15px 0 9px}.day-head h3{margin:0;font-size:16px}.checkline{display:flex;align-items:flex-start;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line)}.checkline input{margin-top:3px;accent-color:var(--green);width:18px;height:18px}.checkline.done .itemname{text-decoration:line-through;color:#8a9085}.qtyline{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;background:#edf2e8;color:#52694d;border-radius:6px;padding:4px 6px;font-size:10px;font-weight:750}.empty{text-align:center;padding:28px 16px;color:var(--muted);background:white;border-radius:16px;border:1px dashed var(--line);font-size:13px}.modal{position:fixed;inset:0;z-index:30;background:#1720167a;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:100%;max-width:700px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.sheet h2{margin:4px 0 7px;font-size:24px}.close{border:0;background:#e8ebe2;border-radius:50%;width:38px;height:38px;font-size:20px}.ingredient-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.steps{padding-left:22px;line-height:1.7;font-size:14px}.steps li{padding:5px 0}.notice{font-size:12px;color:var(--muted);line-height:1.5;background:#f0eee5;padding:11px;border-radius:12px;margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.count{font-weight:800}.hidden{display:none!important}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:20px}@media(min-width:650px){.wrap{padding-top:25px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:30px}.hero h1{font-size:36px}.recipes-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{align-items:center;padding:20px}.sheet{border-radius:24px;max-height:88dvh}.tabs{padding-bottom:8px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">🍃 우리집 식탁 <small>TABLE MATE · FAMILY RECIPE PLANNER</small></div><button class="pill" id="installBtn" hidden>앱 설치</button></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs"><div class="tab-inner">
<button class="tab active" data-tab="home"><span>⌂</span>홈</button>
<button class="tab" data-tab="ingredients"><span>🥕</span>재료</button>
<button class="tab" data-tab="plan"><span>▦</span>식단</button>
<button class="tab" data-tab="shopping"><span>☑</span>장보기</button>
<button class="tab" data-tab="recipes"><span>📖</span>레시피</button>
</div></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number.isInteger(n) ? String(n) : Number(n.toFixed(1)).toString();
const emojiByCat = {Meat:"🍗",Protein:"🥚",Vegetable:"🥕",Fruit:"🍎",Grain:"🍚",Baking:"🥣",Dairy:"🥛",Pantry:"🥫",Seasoning:"🧂",Legume:"🫘",Herb:"🌿",Frozen:"🧊"};
let db, state, currentTab="home", recipeFilter="전체", recipeQuery="", ingredientSearch="", planDay=0, planMeal="저녁", installPrompt=null;
const days=["월요일","화요일","수요일","목요일","금요일","토요일","일요일"];
const meals=["아침","점심","저녁"];
const defaultState=()=>({pantry:{},plan:{},favorites:[],checked:{},customItems:[]});
function loadState(){try{return {...defaultState(),...JSON.parse(localStorage.getItem("tableMateState")||"{}")}}catch{return defaultState()}}
function saveState(){localStorage.setItem("tableMateState",JSON.stringify(state));}
function ing(id){return db.ingredients.find(x=>x.id===id)}
function rec(id){return db.recipes.find(x=>x.id===id)}
function qtyText(id,q){const i=ing(id);return `${fmt(q)} ${i?.unit||""}`}
function plannedRecipeIds(){return Object.values(state.plan).filter(Boolean)}
function plannedCounts(){const counts={};for(const id of plannedRecipeIds())counts[id]=(counts[id]||0)+1;return counts}
function requiredTotals(){const totals={};for(const [rid,count] of Object.entries(plannedCounts())){const r=rec(rid);if(!r)continue;for(const x of r.ingredients){totals[x.ingredientId]=(totals[x.ingredientId]||0)+x.quantity*(4/4)*count;}}return totals}
function shoppingItems(){const totals=requiredTotals();return Object.entries(totals).map(([id,q])=>({id,need:q,have:Number(state.pantry[id]||0),buy:Math.max(0,q-Number(state.pantry[id]||0))})).filter(x=>x.buy>0).sort((a,b)=>ing(a.id).category.localeCompare(ing(b.id).category)||ing(a.id).name.localeCompare(ing(b.id).name))}
function missingIngredients(r){return r.ingredients.filter(x=>Number(state.pantry[x.ingredientId]||0)<x.quantity).length}
function groupRecipes(){const map=new Map();for(const r of db.recipes){const ids=r.ingredients.map(x=>x.ingredientId).filter(id=>!["salt","pepper","olive_oil","butter","sugar"].includes(id));for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){const key=[ids[a],ids[b]].sort().join("|");if(!map.has(key))map.set(key,{ids:[ids[a],ids[b]],recipes:new Set()});map.get(key).recipes.add(r.id)}}return [...map.values()].filter(g=>g.recipes.size>=3).sort((a,b)=>b.recipes.size-a.recipes.size).slice(0,8)}
function recipeEmoji(r){const ids=r.ingredients.map(x=>x.ingredientId);if(ids.includes("pasta")||ids.includes("noodle"))return "🍝";if(ids.includes("rice"))return "🍚";if(ids.includes("chicken"))return "🍗";if(ids.includes("salmon")||ids.includes("white_fish")||ids.includes("shrimp"))return "🐟";if(ids.includes("egg"))return "🍳";if(ids.includes("tofu")||ids.includes("chickpea")||ids.includes("lentil"))return "🥗";if(ids.includes("potato"))return "🥔";return "🍲"}
function go(tab){currentTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));render()}
function render(){const app=$("#app");if(!db){app.innerHTML='<div class="empty">레시피 데이터를 불러오는 중입니다…</div>';return}if(currentTab==="home")app.innerHTML=homeView();else if(currentTab==="ingredients")app.innerHTML=ingredientsView();else if(currentTab==="plan")app.innerHTML=planView();else if(currentTab==="shopping")app.innerHTML=shoppingView();else app.innerHTML=recipesView();bindPage()}
function homeView(){const groups=groupRecipes();const planN=plannedRecipeIds().length;const shopN=shoppingItems().length;return `
<section class="hero"><div class="eyebrow">LESS WASTE · MORE GOOD MEALS</div><h1>오늘 뭐 먹지?<br>재료부터 시작해요.</h1><p>비슷한 재료로 여러 요리를 만들고<br>한 주 식단과 장보기를 한 번에 관리하세요.</p><div class="stats"><div class="stat"><b>${db.recipes.length}</b>레시피</div><div class="stat"><b>${planN}</b>식단 등록</div><div class="stat"><b>${shopN}</b>장보기 항목</div></div></section>
<section class="section"><div class="section-head"><div><h2>재료로 요리 묶음 찾기</h2><div class="sub">공통 재료를 공유하는 요리 그룹</div></div><button class="secondary" data-go="ingredients">내 재료 →</button></div><div class="grid">${groups.slice(0,4).map(g=>`<article class="card"><div class="group-icon">${emojiByCat[ing(g.ids[0]).category]||"🥕"} ${emojiByCat[ing(g.ids[1]).category]||"🍲"}</div><h3>${esc(ing(g.ids[0]).name)} · ${esc(ing(g.ids[1]).name)}</h3><p>${g.recipes.size}개 요리 · ${g.recipes.size>=5?"활용도 높은 조합":"함께 쓰기 좋은 조합"}</p><div class="chips"><span class="chip">${esc(ing(g.ids[0]).name)}</span><span class="chip">${esc(ing(g.ids[1]).name)}</span></div><button class="secondary full" data-group="${g.ids.join(",")}">요리 보기</button></article>`).join("")}</div></section>
<section class="section"><div class="section-head"><div><h2>바로 시작하기</h2><div class="sub">자주 쓰는 기능으로 빠르게 이동</div></div></div><div class="two"><button class="primary" data-go="plan">📅 주간 메뉴 짜기</button><button class="secondary" data-go="shopping">🛒 장보기 목록 보기</button></div></section>
<section class="section"><div class="section-head"><div><h2>간단히 만들 수 있는 요리</h2><div class="sub">조리 시간이 짧은 레시피</div></div><button class="secondary" data-go="recipes">전체 보기</button></div><div class="grid recipes-grid">${db.recipes.filter(r=>r.prepMinutes+r.cookMinutes<=25).slice(0,4).map(recipeCard).join("")}</div></section>
<p class="footnote">레시피는 가정용 참고 자료입니다. 재료와 조리 기구에 따라 시간과 양은 달라질 수 있습니다.</p>`}
function recipeCard(r){return `<article class="card recipe-card"><div class="food-emoji">${recipeEmoji(r)}</div><div class="recipe-info"><h3>${esc(r.name)}</h3><div class="tiny">${esc(r.cuisine)} · ${r.prepMinutes+r.cookMinutes}분 · ${esc(r.difficulty)}</div><div class="chips">${r.tags.slice(0,2).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div><div class="recipe-actions"><button class="secondary" data-recipe="${r.id}">레시피</button><button class="secondary" data-add="${r.id}">식단 추가</button><button class="secondary" data-fav="${r.id}">${state.favorites.includes(r.id)?"♥":"♡"}</button></div></div></article>`}
function ingredientsView(){const q=ingredientSearch.toLowerCase();const filtered=db.ingredients.filter(i=>(i.name+" "+i.aliases.join(" ")).toLowerCase().includes(q));const saved=Object.keys(state.pantry).filter(id=>Number(state.pantry[id])>0);const totals=requiredTotals();return `<section class="section"><div class="section-head"><div><h2>우리 집 재료</h2><div class="sub">현재 보유량을 입력하면 장보기에서 차감합니다.</div></div><span class="badge">${saved.length}개 등록</span></div><input class="field" id="ingredientSearch" placeholder="재료 검색 (한국어·독일어)" value="${esc(ingredientSearch)}"><div class="chips" style="margin-top:12px"><span class="chip">보유량 단위는 재료별 기준 단위 사용</span><span class="chip">0으로 입력하면 보유 목록에서 제외</span></div><div id="ingredientList">${filtered.slice(0,90).map(i=>`<div class="checkline"><div style="font-size:22px">${emojiByCat[i.category]||"🥕"}</div><div class="grow"><div class="itemname">${esc(i.name)} <span class="tiny">(${esc(i.unit)})</span></div><div class="qtyline">${esc(i.aliases.slice(0,2).join(" · "))}</div></div><input aria-label="${esc(i.name)} 보유량" type="number" min="0" step="any" data-pantry="${i.id}" value="${state.pantry[i.id]??""}" placeholder="0" style="width:85px;border:1px solid var(--line);border-radius:9px;padding:8px"></div>`).join("")}</div><button class="primary full" id="showAvailable" style="margin-top:14px">내 재료로 만들 수 있는 요리 보기</button></section><section class="section" id="availableSection"><h2>추천 요리</h2><div class="sub">필수 재료 부족 수와 조리 시간을 함께 확인하세요.</div><div class="grid recipes-grid" style="margin-top:12px">${db.recipes.map(r=>({r,n:missingIngredients(r)})).sort((a,b)=>a.n-b.n||a.r.prepMinutes+a.r.cookMinutes-(b.r.prepMinutes+b.r.cookMinutes)).slice(0,8).map(({r,n})=>`<article class="card recipe-card"><div class="food-emoji">${recipeEmoji(r)}</div><div class="recipe-info"><h3>${esc(r.name)}</h3><div class="tiny">${n===0?"필요량 기준으로 만들 수 있음":`추가 확인할 재료 ${n}개`} · ${r.prepMinutes+r.cookMinutes}분</div><div class="recipe-actions"><button class="secondary" data-recipe="${r.id}">레시피</button><button class="secondary" data-add="${r.id}">식단 추가</button></div></div></article>`).join("")}</div></section>`}
function planView(){const count=plannedRecipeIds().length;return `<section class="section"><div class="section-head"><div><h2>주간 식단</h2><div class="sub">각 날짜의 식사 메뉴를 선택하세요. 메뉴 변경은 장보기 목록에 반영됩니다.</div></div><button class="secondary" id="clearPlan">비우기</button></div><div class="row"><div class="grow"><span class="badge">${count}개 식사 등록</span></div><button class="primary" id="toShopping">장보기 계산 →</button></div>${days.map((day,di)=>`<div class="day-head"><h3>${day}</h3><span class="tiny">${meals.filter(m=>state.plan[`${di}-${m}`]).length}/3 식사</span></div><div class="grid">${meals.map(meal=>{const key=`${di}-${meal}`,selected=state.plan[key]||"";return `<div class="slot"><div class="slot-title">${meal}</div><select data-plan="${key}"><option value="">메뉴 선택</option>${db.recipes.map(r=>`<option value="${r.id}" ${selected===r.id?"selected":""}>${esc(r.name)}</option>`).join("")}</select>${selected?`<div class="tiny" style="margin-top:7px">${rec(selected).prepMinutes+rec(selected).cookMinutes}분 · ${esc(rec(selected).cuisine)}</div><button class="secondary full" style="margin-top:7px" data-recipe="${selected}">레시피 보기</button>`:""}</div>`}).join("")}</div>`).join("")}<div class="notice">현재 기본 인분은 레시피당 4인분입니다. 같은 메뉴를 여러 식사에 배치하면 재료량도 그 횟수만큼 계산합니다.</div></section>`}
function shoppingView(){const items=shoppingItems();const done=items.filter(x=>state.checked[x.id]).length;return `<section class="section"><div class="section-head"><div><h2>장보기 목록</h2><div class="sub">주간 식단 재료를 합산하고 보유량을 차감했습니다.</div></div><span class="badge">${done}/${items.length} 완료</span></div><div class="row" style="margin-bottom:12px"><button class="secondary grow" id="copyShopping">목록 복사</button><button class="secondary grow" id="resetChecks">체크 초기화</button></div>${items.length?Object.entries(items.reduce((a,x)=>{const cat=ing(x.id).category;(a[cat]??=[]).push(x);return a},{})).map(([cat,list])=>`<div class="section"><div class="day-head"><h3>${esc(cat)}</h3><span class="tiny">${list.length}개</span></div>${list.map(x=>`<label class="checkline ${state.checked[x.id]?"done":""}"><input type="checkbox" data-check="${x.id}" ${state.checked[x.id]?"checked":""}><div class="grow"><div class="itemname">${esc(ing(x.id).name)}</div><div class="qtyline">필요 ${qtyText(x.id,x.need)} · 보유 ${qtyText(x.id,x.have)} · <b>구매 ${qtyText(x.id,x.buy)}</b></div></div></label>`).join("")}</div>`).join(""):`<div class="empty">장보기 항목이 없습니다.<br><br>주간 식단에 메뉴를 추가하거나, 이미 보유한 재료의 수량을 확인해 보세요.</div>`}<div class="notice">장보기 수량은 레시피 4인분 기준입니다. 조미료 등 이미 집에 있는 재료도 보유량을 등록하면 구매 수량에서 차감됩니다.</div></section>`}
function recipesView(){let list=db.recipes.filter(r=>(r.name+" "+r.cuisine+" "+r.tags.join(" ")).toLowerCase().includes(recipeQuery.toLowerCase()));if(recipeFilter!=="전체")list=list.filter(r=>r.cuisine===recipeFilter||r.tags.includes(recipeFilter));return `<section class="section"><div class="section-head"><div><h2>레시피 60</h2><div class="sub">한국식·유럽식·간편식·가성비 요리를 한곳에서</div></div><span class="badge">${list.length}개</span></div><input class="field" id="recipeSearch" placeholder="요리 이름, 종류, 태그 검색" value="${esc(recipeQuery)}"><div class="filterbar">${["전체","한국식","유럽식","혼합","아시아식","간편식","가성비","채식","가족식"].map(x=>`<button class="${recipeFilter===x?"active":""}" data-filter="${x}">${x}</button>`).join("")}</div><div class="grid recipes-grid">${list.map(recipeCard).join("")||'<div class="empty">검색 결과가 없습니다.</div>'}</div></section>`}
function openRecipe(id){const r=rec(id);if(!r)return;$("#sheet").innerHTML=`<div class="sheet-head"><div><div class="eyebrow">${esc(r.cuisine)} · ${esc(r.difficulty)}</div><h2>${recipeEmoji(r)} ${esc(r.name)}</h2><div class="tiny">준비 ${r.prepMinutes}분 · 조리 ${r.cookMinutes}분 · 기본 ${r.servings}인분</div></div><button class="close" id="closeModal" aria-label="닫기">×</button></div><div class="chips">${r.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div><div class="section"><div class="section-head"><h2>재료와 분량</h2><div class="row"><label class="tiny" for="servings">인분</label><select id="servings" class="field" style="width:80px;padding:8px"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></div></div><div id="recipeIngredients">${r.ingredients.map(x=>`<div class="ingredient-line"><span>${esc(ing(x.ingredientId).name)}${x.required?"":" (선택)"}</span><b>${qtyText(x.ingredientId,x.quantity)}</b></div>`).join("")}</div></div><div class="section"><h2>조리 순서</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div><div class="notice">${esc(r.notes)}<br>알레르기 유발 성분은 각 재료의 포장 표시를 확인하세요.</div><div class="two" style="margin-top:14px"><button class="secondary" id="favModal">${state.favorites.includes(id)?"♥ 즐겨찾기 해제":"♡ 즐겨찾기"}</button><button class="primary" id="addModal">주간 식단에 추가</button></div>`;$("#modal").classList.add("show");$("#closeModal").onclick=closeModal;$("#servings").onchange=e=>{$("#recipeIngredients").innerHTML=r.ingredients.map(x=>`<div class="ingredient-line"><span>${esc(ing(x.ingredientId).name)}</span><b>${qtyText(x.ingredientId,x.quantity*Number(e.target.value)/r.servings)}</b></div>`).join("")};$("#favModal").onclick=()=>{toggleFav(id);openRecipe(id)};$("#addModal").onclick=()=>{closeModal();showAddToPlan(id)}}
function closeModal(){$("#modal").classList.remove("show")}
function showAddToPlan(id){$("#sheet").innerHTML=`<div class="sheet-head"><div><div class="eyebrow">ADD TO WEEKLY PLAN</div><h2>식단에 추가</h2><p class="sub">${esc(rec(id).name)}</p></div><button class="close" id="closeModal">×</button></div><div class="two"><div><label class="tiny">요일</label><select class="field" id="addDay">${days.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></div><div><label class="tiny">식사</label><select class="field" id="addMeal">${meals.map(m=>`<option>${m}</option>`).join("")}</select></div></div><button class="primary full" id="confirmAdd" style="margin-top:14px">이 식사에 추가</button>`;$("#modal").classList.add("show");$("#closeModal").onclick=closeModal;$("#confirmAdd").onclick=()=>{const key=$("#addDay").value+"-"+$("#addMeal").value;state.plan[key]=id;saveState();closeModal();go("plan")}}
function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];saveState();render()}
function bindPage(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>openRecipe(b.dataset.recipe));document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>showAddToPlan(b.dataset.add));document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{toggleFav(b.dataset.fav)});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{recipeFilter=b.dataset.filter;render()});document.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{const ids=b.dataset.group.split(",");recipeQuery="";recipeFilter="전체";go("recipes");const matches=db.recipes.filter(r=>ids.every(id=>r.ingredients.some(x=>x.ingredientId===id)));$("#app").querySelector(".section-head .sub").textContent=`${ing(ids[0]).name} · ${ing(ids[1]).name} 공통 재료 그룹`;const container=$("#app").querySelector(".recipes-grid");if(container){container.innerHTML=matches.map(recipeCard).join("");bindPage()}});document.querySelectorAll("[data-pantry]").forEach(el=>el.onchange=()=>{const id=el.dataset.pantry;const v=Math.max(0,Number(el.value)||0);if(v>0)state.pantry[id]=v;else delete state.pantry[id];saveState()});document.querySelectorAll("[data-plan]").forEach(el=>el.onchange=()=>{if(el.value)state.plan[el.dataset.plan]=el.value;else delete state.plan[el.dataset.plan];saveState();render()});document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{state.checked[el.dataset.check]=el.checked;saveState();render()});const iq=$("#ingredientSearch");if(iq)iq.oninput=e=>{ingredientSearch=e.target.value;const pos=e.target.selectionStart;render();const next=$("#ingredientSearch");next.focus();next.setSelectionRange(pos,pos)};const rq=$("#recipeSearch");if(rq)rq.oninput=e=>{recipeQuery=e.target.value;const pos=e.target.selectionStart;render();const next=$("#recipeSearch");next.focus();next.setSelectionRange(pos,pos)};const show=$("#showAvailable");if(show)show.onclick=()=>{$("#availableSection").scrollIntoView({behavior:"smooth"})};const clear=$("#clearPlan");if(clear)clear.onclick=()=>{if(confirm("주간 식단을 모두 비울까요?")){state.plan={};state.checked={};saveState();render()}};const toShop=$("#toShopping");if(toShop)toShop.onclick=()=>go("shopping");const copy=$("#copyShopping");if(copy)copy.onclick=()=>{const text=shoppingItems().map(x=>`${ing(x.id).name}: ${qtyText(x.id,x.buy)}`).join("\n");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert("장보기 목록을 복사했습니다.")).catch(()=>prompt("목록을 복사하세요",text));else prompt("목록을 복사하세요",text)};const reset=$("#resetChecks");if(reset)reset.onclick=()=>{state.checked={};saveState();render()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("#installBtn").hidden=true}else alert("Safari에서는 공유 버튼을 누른 뒤 '홈 화면에 추가'를 선택하세요.")};
async function init(){try{const response=await fetch("./recipes.json");if(!response.ok)throw new Error("recipes.json을 읽을 수 없습니다.");db=await response.json();state=loadState();render();if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});}catch(e){$("#app").innerHTML=`<div class="empty"><b>레시피 데이터를 불러오지 못했습니다.</b><br><br>${esc(e.message)}<br>index.html과 recipes.json이 같은 폴더에 있는지 확인하세요.</div>`}}
init();
</script>
</body></html>
